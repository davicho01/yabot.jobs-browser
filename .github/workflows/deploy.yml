name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  PROJECT_ID: yabotjobs
  REGION: us-central1
  SERVICE: yabot-jobs-browser
  IMAGE: us-central1-docker.pkg.dev/yabotjobs/yabot-jobs-browser/yabot-jobs-browser

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build image
        run: docker build -t "${IMAGE}:${{ github.sha }}" -t "${IMAGE}:latest" .

      - name: Push image
        run: |
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          # Cloud Run's default concurrency (80) let many concurrent /fetch
          # calls land on one instance, each launching its own full
          # Chromium process - verified live: careers.ibm.com's ~160-job
          # crawl OOM-killed the container repeatedly under real
          # concurrency (crawl-worker's max_concurrent_scans=3 per source,
          # across the whole fleet), scans failing and getting worse as
          # requests piled onto instances mid-OOM-restart. One Chromium
          # process per instance, with real headroom instead of squeezed
          # into 1Gi.
          #
          # max-instances went 20 -> 60 -> 100 chasing "no available
          # instance" aborts that never actually stopped - verified live
          # each time - because the ceiling was never the real bottleneck:
          # with min-instances=0, only ~3 instances were ever actually
          # running even at 100 max and under sustained heavy contention,
          # and no new ones were starting. Cloud Run's reactive autoscaling
          # isn't keeping up with this container's cold-start cost (a fresh
          # Chromium launch per request, not just process boot) under
          # bursty crawl-worker traffic. min-instances=3 keeps that many
          # warm and ready as a guaranteed floor instead of depending on
          # scale-from-zero fast enough to absorb a burst - a standing cost
          # now, not just a peak-capacity knob.
          flags: --min-instances=3 --max-instances=100 --concurrency=1 --memory=2Gi --timeout=90
